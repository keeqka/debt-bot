<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Фавикон = верх маскота «Чек»: оторванный край ленты + спокойное лицо,
       та же геометрия и цвета, что в src/components/Mascot.tsx, обрезанные
       до верхних ~90 юнитов (до первой печатной строки чека) и слегка
       увеличенные, чтобы лицо читалось в 16×16. Фон — тёмный hf bg,
       на нём маскот стоит везде в приложении. -->
  <rect width="100" height="100" fill="#17181c" />
  <clipPath id="crop">
    <rect width="100" height="100" />
  </clipPath>
  <g clip-path="url(#crop)">
    <g transform="rotate(-2.5 50 42) scale(1.18) translate(-9 -4)">
      <path
        d="M0,4 L8.33,0 L16.67,4 L25,0 L33.33,4 L41.67,0 L50,4 L58.33,0 L66.67,4 L75,0 L83.33,4 L91.67,0 L100,4 V95 H0 Z"
        fill="#F6F1E8"
      />
      <rect x="20" y="11" width="60" height="4" rx="1" fill="#BDB4A5" />
      <g fill="#191C21">
        <ellipse cx="28.5" cy="31" rx="7.5" ry="5.5" />
        <ellipse cx="71.5" cy="31" rx="7.5" ry="5.5" />
        <rect x="40" y="55" width="20" height="3.8" rx="1.6" />
      </g>
      <rect x="20" y="82.5" width="60" height="1" fill="#DED6C8" />
    </g>
  </g>
</svg>
