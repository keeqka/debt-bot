name: Deploy backend (Supabase)

# Pushes DB migrations and Edge Functions on every push to main that touches
# supabase/**. Requires these repo secrets (Settings → Secrets and variables
# → Actions) — see README.md "Деплой через CI/CD":
#   SUPABASE_ACCESS_TOKEN   personal access token: supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    project ref (in the project URL / Settings → General)
#   SUPABASE_DB_PASSWORD    the project's Postgres password (set when the project was created)
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_ALLOWED_USER_IDS   comma-separated, e.g. 111111111,222222222
#   ANTHROPIC_API_KEY
#   SUPABASE_JWT_SECRET     Settings → API → JWT Keys → "JWT Secret" (legacy) — used to sign our own session tokens, not the platform's
#   CRON_SECRET             any random string you generate once, reused by pg_cron and the Telegram webhook

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push database migrations
        run: supabase db push

      - name: Sync function secrets
        run: |
          supabase secrets set \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            TELEGRAM_ALLOWED_USER_IDS="${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            SUPABASE_JWT_SECRET="${{ secrets.SUPABASE_JWT_SECRET }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET }}"

      - name: Deploy Edge Functions
        run: supabase functions deploy
